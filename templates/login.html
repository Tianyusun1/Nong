{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5 col-lg-4">

        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
                <!-- 头部 Logo 与标题 -->
                <div class="text-center mb-4">
                    <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-person-circle fs-2"></i>
                    </div>
                    <h4 class="fw-bold text-dark">欢迎回来</h4>
                    <p class="text-muted small mb-0">登录您的智慧助农账号</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold ms-1">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted rounded-start-pill ps-3"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control bg-light border-start-0 rounded-end-pill py-2" placeholder="请输入用户名" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold ms-1">密码</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted rounded-start-pill ps-3"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control bg-light border-start-0 rounded-end-pill py-2" placeholder="请输入密码" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success rounded-pill py-2 fw-bold shadow-sm hover-lift">
                            立即登录 <i class="bi bi-arrow-right-short fs-5 align-middle"></i>
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <small class="text-muted">还没有账号?</small>
                    <a href="{{ url_for('register') }}" class="text-success text-decoration-none fw-bold ms-1">免费注册</a>
                </div>
            </div>
        </div>

    </div>
</div>

<style>
    .hover-lift {
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3) !important;
    }
    .form-control:focus {
        background-color: #fff !important;
        border-color: #a3cfbb;
        box-shadow: none;
    }
    .input-group:focus-within {
        box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
        border-radius: 50rem;
    }
    .input-group:focus-within .input-group-text {
        background-color: #fff !important;
        border-color: #a3cfbb;
    }
</style>
{% endblock %}
