{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <!-- 页面头部 -->
        <div class="d-flex align-items-center mb-4">
            <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px;">
                <i class="bi bi-plus-lg fs-4"></i>
            </div>
            <div>
                <h3 class="fw-bold text-dark mb-0">发布新农产品</h3>
                <small class="text-muted">上架您的优质农产品，让更多人看到</small>
            </div>
        </div>

        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- 顶部装饰条 -->
            <div class="card-header bg-success py-2"></div>

            <div class="card-body p-4 p-lg-5">
                <form method="POST" action="{{ url_for('publish_product') }}" enctype="multipart/form-data">

                    <!-- 1. 基本信息区块 -->
                    <div class="mb-5">
                        <h5 class="fw-bold text-dark mb-4 pb-2 border-bottom">
                            <i class="bi bi-info-circle text-success me-2"></i>基本信息
                        </h5>
                        <div class="row g-4">
                            <div class="col-md-8">
                                <label class="form-label text-muted small fw-bold">商品名称</label>
                                <input type="text" name="name" class="form-control bg-light border-0 py-2 px-3" required placeholder="例如：高山有机红富士苹果">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold">商品分类</label>
                                <select name="category" class="form-select bg-light border-0 py-2 px-3" required>
                                    <option value="" disabled selected>请选择分类</option>
                                    <option value="水果">🍎 水果鲜果</option>
                                    <option value="蔬菜">🥦 新鲜蔬菜</option>
                                    <option value="肉禽蛋">🥚 肉禽蛋品</option>
                                    <option value="粮油">🍚 粮油米面</option>
                                    <option value="特产">🎁 地方特产</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">产地</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="bi bi-geo-alt text-success"></i></span>
                                    <input type="text" name="origin" class="form-control bg-light border-0" required placeholder="例如：山东烟台">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">运费模板</label>
                                <select name="shipping_template_id" class="form-select bg-light border-0 py-2 px-3" required>
                                    <option value="1">🚛 默认运费 (¥10)</option>
                                    <option value="2">🧊 冷链运费 (¥25)</option>
                                    <option value="3">✨ 免运费 (¥0)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 默认规格 (SKU) 信息 -->
                    <div class="mb-5">
                        <h5 class="fw-bold text-dark mb-4 pb-2 border-bottom">
                            <i class="bi bi-tags text-success me-2"></i>默认规格与库存
                        </h5>

                        <div class="card border border-success border-opacity-25 shadow-sm rounded-3 bg-success bg-opacity-10">
                            <div class="card-body p-4">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label text-muted small fw-bold mb-1">规格名称</label>
                                        <input type="text" name="spec_name" class="form-control border-success border-opacity-25" value="普通 500g 装" required placeholder="例如：5斤装、礼盒装">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-muted small fw-bold mb-1">规格价格 (元)</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white text-muted border-success border-opacity-25">￥</span>
                                            <input type="number" step="0.01" name="price" class="form-control fw-bold text-danger border-success border-opacity-25" required placeholder="0.00">
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label text-muted small fw-bold mb-1">初始库存</label>
                                        <input type="number" name="stock" class="form-control border-success border-opacity-25" value="100" required>
                                    </div>
                                </div>
                                <div class="mt-2 text-muted small fst-italic">
                                    <i class="bi bi-info-circle me-1"></i> 发布后可在“编辑商品”中添加更多规格。
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 图片与描述区块 -->
                    <div class="mb-4">
                        <h5 class="fw-bold text-dark mb-4 pb-2 border-bottom">
                            <i class="bi bi-image text-success me-2"></i>图片与详情
                        </h5>

                        <div class="row g-4">
                            <div class="col-md-12">
                                <label class="form-label text-muted small fw-bold">商品主图</label>
                                <div class="p-3 bg-light rounded-3 border border-light">
                                    <label for="imageUpload" class="btn btn-outline-secondary w-100 mb-2 text-start">
                                        <i class="bi bi-cloud-upload me-2"></i>点击上传图片 (支持 jpg, png, gif)
                                    </label>
                                    <input type="file" id="imageUpload" name="image_file" class="form-control d-none" accept="image/*" onchange="document.getElementById('fileName').textContent = this.files[0] ? this.files[0].name : ''">
                                    <div id="fileName" class="small text-success mb-2 ps-1"></div>

                                    <div class="position-relative">
                                        <input type="url" name="image_url" class="form-control bg-white form-control-sm ps-5" placeholder="或者输入网络图片 URL (可选)">
                                        <span class="position-absolute top-50 start-0 translate-middle-y ms-2 text-muted small"><i class="bi bi-link-45deg fs-5"></i></span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label text-muted small fw-bold">详细描述</label>
                                <textarea name="description" class="form-control bg-light border-0 px-3 py-3" rows="6" placeholder="请详细描述您的农产品特色、种植环境、口感风味等..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-5 pt-3 border-top">
                        <a href="{{ url_for('profile') }}" class="btn btn-light rounded-pill px-4 py-2 fw-bold text-secondary">
                            取消
                        </a>
                        <button type="submit" class="btn btn-success rounded-pill px-5 py-2 fw-bold shadow-sm hover-lift">
                            <i class="bi bi-rocket-takeoff me-2"></i>立即发布上架
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus, .form-select:focus {
        border-color: #198754;
        box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
        background-color: #fff !important;
    }
    .hover-lift {
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3) !important;
    }
</style>
{% endblock %}
