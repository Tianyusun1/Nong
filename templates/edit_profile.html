{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-lg-5 col-md-7">

        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- 头部 -->
            <div class="card-header bg-white border-bottom p-4">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px;">
                        <i class="bi bi-person-gear fs-4"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold text-dark mb-0">编辑个人资料</h4>
                        <small class="text-muted">完善您的联系方式{% if user.role == 1 %}与店铺信息{% endif %}</small>
                    </div>
                </div>
            </div>

            <div class="card-body p-4">
                <form method="POST">
                    <!-- 基本信息 -->
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">基本联系信息</label>

                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control bg-light border-start-0 py-2" value="{{ user.email or '' }}" placeholder="电子邮箱地址">
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-phone"></i></span>
                                <input type="text" name="phone" class="form-control bg-light border-start-0 py-2" value="{{ user.phone or '' }}" placeholder="联系电话">
                            </div>
                        </div>
                    </div>

                    {% if user.role == 1 %}
                    <hr class="border-light my-4">

                    <!-- 店铺信息 (仅农户可见) -->
                    <div class="mb-4">
                        <div class="d-flex align-items-center mb-3">
                            <label class="form-label text-success small fw-bold mb-0">店铺经营信息</label>
                            <span class="badge bg-success bg-opacity-10 text-success ms-2" style="font-size: 0.7rem;">农户专属</span>
                        </div>

                        <div class="bg-success bg-opacity-10 p-3 rounded-3">
                            <div class="mb-3">
                                <label class="form-label text-muted small" style="font-size: 0.8rem;">店铺名称</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-success"><i class="bi bi-shop"></i></span>
                                    <input type="text" name="shop_name" class="form-control bg-white border-start-0" value="{{ user.farmer_info.shop_name if user.farmer_info else '' }}" placeholder="请输入店铺名称">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small" style="font-size: 0.8rem;">发货地址</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-success"><i class="bi bi-geo-alt"></i></span>
                                    <input type="text" name="farm_address" class="form-control bg-white border-start-0" value="{{ user.farmer_info.farm_address if user.farmer_info else '' }}" placeholder="请输入详细发货地址">
                                </div>
                            </div>
                            <div class="mb-0">
                                <label class="form-label text-muted small" style="font-size: 0.8rem;">联系人</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0 text-success"><i class="bi bi-person-badge"></i></span>
                                    <input type="text" name="contact_person" class="form-control bg-white border-start-0" value="{{ user.farmer_info.contact_person if user.farmer_info else '' }}" placeholder="主要负责人姓名">
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endif %}

                    <div class="d-grid gap-2 mt-4 pt-2">
                        <button type="submit" class="btn btn-success rounded-pill py-2 fw-bold shadow-sm hover-lift">
                            <i class="bi bi-check2-circle me-2"></i>保存修改
                        </button>
                        <a href="{{ url_for('profile') }}" class="btn btn-light rounded-pill py-2 text-muted">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .hover-lift {
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3);
    }
    .form-control:focus {
        box-shadow: none;
        border-color: #ced4da; /* 保持边框颜色柔和，或者改为主题色 */
    }
    .input-group:focus-within {
        box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
        border-radius: 0.375rem;
    }
    .input-group:focus-within .form-control,
    .input-group:focus-within .input-group-text {
        border-color: #198754;
    }
</style>
{% endblock %}
